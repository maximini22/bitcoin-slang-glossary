<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>LRC editor — Bitcoin Slang</title>
<link rel="stylesheet" href="/styles.css"/>
<link rel="stylesheet" href="/editor/editor.css?v=20261104-2115"/>
</head>
<body class="editor-page">
<header class="ed-top">
  <div class="ed-brand"><a href="/">LRC preview</a> · <span>Editor</span></div>
  <label class="ed-song-label">
    <span class="sr-only">Song</span>
    <select id="song" aria-label="Song">
      <!-- filled by editor.js -->
    </select>
  </label>
  <p class="ed-final-note">Latest R2 draft per song is the <strong>final</strong> that will be pushed.</p>
</header>

<section class="ed-transport" aria-label="Playback">
  <div class="ed-time-row">
    <span id="curTime">0:00.00</span>
    <input id="seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="Seek"/>
    <span id="durTime">0:00.00</span>
  </div>
  <div class="ed-btns">
    <button type="button" id="btnBack" class="ed-btn" title="Back 5s (←)">−5s</button>
    <button type="button" id="btnPlay" class="ed-btn ed-btn-accent" title="Play/Pause">Play</button>
    <button type="button" id="btnFwd" class="ed-btn" title="Forward 5s (→)">+5s</button>
    <button type="button" id="btnSpeed" class="ed-btn" title="Playback speed">1×</button>
    <button type="button" id="btnUndo" class="ed-btn" title="Undo">Undo</button>
  </div>
  <button type="button" id="btnStamp" class="ed-stamp" title="Stamp current time on selected line (Space)">STAMP</button>
  <p class="ed-hint">Space = stamp · tap line = play from there · ←/→ = ±5s · Edit text in the field</p>
</section>

<section class="ed-actions" aria-label="Save">
  <button type="button" id="btnSave" class="ed-btn ed-btn-accent">Save draft</button>
  <button type="button" id="btnCopy" class="ed-btn">Copy text</button>
  <button type="button" id="btnDownload" class="ed-btn">Download .lrc</button>
  <button type="button" id="btnReloadSaved" class="ed-btn" title="Discard local autosave and load latest R2 draft">Reload saved</button>
  <button type="button" id="btnAddSection" class="ed-btn">+ Section</button>
  <button type="button" id="btnClearTimes" class="ed-btn ed-btn-warn" title="Blank every timestamp, keep lyric text">Clear all timestamps</button>
  <span id="status" class="ed-status" role="status"></span>
</section>

<audio id="audio" preload="metadata"></audio>

<div id="lines" class="ed-lines" role="list" aria-label="Lyrics lines"></div>

<script src="/editor/editor.js?v=20261104-2115"></script>
</body>
</html>
